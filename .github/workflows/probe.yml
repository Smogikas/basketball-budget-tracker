name: Probe sites

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "feeds = find feeds for config/probe_urls.txt, pages = find older-page formats for config/sites.json"
        default: pages
      only:
        description: "pages mode: only sites whose name starts with these (comma-separated); empty = all"
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/${{ inputs.mode == 'feeds' && 'probe.py' || 'probe_pages.py' }}
        timeout-minutes: 10
        env:
          PROBE_ONLY: ${{ inputs.only }}
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json data/paging.json 2>/dev/null; git add data
          git diff --cached --quiet || (git commit -m "Probe sites" && git pull --rebase && git push)
