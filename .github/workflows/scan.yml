name: Daily scan

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours at :17 (only new articles)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: scan                 # never runs at the same time as a backfill
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/scan.py
        timeout-minutes: 25
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Scan $(date -u '+%F %H:%M')"
            git pull --rebase -X theirs || true
            git push
          fi
