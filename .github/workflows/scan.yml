name: Daily scan

on:
  schedule:
    - cron: "23 4 * * *"   # every day 04:23 UTC (06:23 Vilnius in winter, 07:23 in summer)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/scan.py
        timeout-minutes: 25
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily scan $(date -u +%F)"
            git push
          fi
